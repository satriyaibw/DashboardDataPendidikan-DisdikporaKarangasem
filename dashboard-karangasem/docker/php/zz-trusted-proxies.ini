; =============================================================================
; Cloudflare Quick Tunnel — forwarded headers untuk reverse proxy lokal
; =============================================================================
;
; PHP-FPM berjalan dengan `clear_env = yes`, sehingga variabel environment yang
; disuntikkan Docker (TRUSTED_PROXIES) TIDAK terlihat oleh getenv()/$_ENV.
; Akibatnya `env('TRUSTED_PROXIES')` di bootstrap/app.php bernilai kosong:
; closure withMiddleware() berjalan sebelum .env dimuat, satu-satunya sumber
; nilai adalah environment container — yang justru dibuang PHP-FPM.
;
; Catatan: `artisan serve` mewarisi allowlist variabel milik framework
; (Illuminate\Foundation\Console\ServeCommand::$passthroughVariables) dan
; membuang semua env lain. Karena itu TRUSTED_PROXIES ikut ditulis ke
; $passthroughVariables dari config/app.php — tanpa itu proses `-S` anak
; berjalan tanpa nilai ini walau sudah tersedia di parent.
;
; Petunjuk env[] di bawah meneruskan nilainya ke setiap proses PHP.
; Nilai ${TRUSTED_PROXIES} di-expand oleh PHP dari environment proses.
;
; Tanpa ini, header X-Forwarded-* dari tunnel diabaikan: redirect login keluar
; dengan skema http:// dan session cookie tidak cocok dengan HTTPS.
; =============================================================================

env[TRUSTED_PROXIES] = "${TRUSTED_PROXIES}"
