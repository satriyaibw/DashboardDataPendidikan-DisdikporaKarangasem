services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # Dioperuskan sebagai environment container, BUKAN hanya dari .env.
            # Closure `withMiddleware()` dieksekusi saat HttpKernel di-resolve,
            # yaitu SEBELUM Laravel memuat .env — jadi `env('TRUSTED_PROXIES')`
            # di bootstrap/app.php masih kosong dan daftar proxy tak pernah
            # didaftarkan. Akibatnya X-Forwarded-* dari reverse proxy diabaikan
            # dan redirect keluar dengan skema http://. Docker sudah menyediakan
            # nilainya di $_SERVER sebelum PHP berjalan, jadi env() di sana
            # langsung terisi.
            TRUSTED_PROXIES: '${TRUSTED_PROXIES:-}'
        volumes:
            - '.:/var/www/html'
            # `artisan serve` (PHP built-in server, bukan FPM) hanya membaca env[]
            # dari php.ini CLI. Tanpa mount ini, env container (TRUSTED_PROXIES)
            # tidak terlihat oleh getenv(), sehingga bootstrap/app.php mendaftarkan
            # daftar proxy kosong dan header X-Forwarded-* dari tunnel diabaikan.
            # Lihat docker/php/zz-trusted-proxies.ini.
            - './docker/php/zz-trusted-proxies.ini:/etc/php/8.5/cli/conf.d/zz-trusted-proxies.ini:ro'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
