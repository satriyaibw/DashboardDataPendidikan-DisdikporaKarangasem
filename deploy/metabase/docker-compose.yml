# ============================================================================
# Fase 2 — Metabase OSS + PostgreSQL Metadata
#
# Spesifikasi: MasterPlan.md §6, Issue #3
# - Metabase terhubung read-only ke backbone_client (role `analis`, SSL aktif)
# - Hanya membaca schema kontrak `metrics.*`
# - 2 dashboard: Publik (non-sensitif) & VIP (analitik dalam, tanpa PII)
# - Query caching aktif
# - Siap untuk Guest/Static Embedding (JWT HS256)
#
# Cara pakai:
#   1. cp .env.example .env
#   2. Isi nilai nyata (jangan commit .env)
#   3. docker compose up -d
#   4. Buka http://localhost:3000
# ============================================================================

services:
  metabase:
    image: metabase/metabase:v0.55.4  # Pin versi stabil (jangan latest di produksi)
    container_name: metabase
    hostname: metabase
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Bind ke localhost (akses via reverse proxy/VPN)
    environment:
      # --- Metadata database (PostgreSQL terpisah) ---
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_MB_DB_DBNAME:-metabase}
      MB_DB_USER: ${METABASE_MB_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_MB_DB_PASS:?MB_DB_PASS harus diisi di .env}

      # --- Embedding Secret (min. 32 karakter, generate: openssl rand -hex 32) ---
      MB_EMBEDDING_SECRET_KEY: ${METABASE_MB_EMBEDDING_SECRET_KEY:?MB_EMBEDDING_SECRET_KEY harus diisi di .env}

      # --- Site URL (untuk embed & public link) ---
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3000}

      # --- Locale ---
      MB_APPLICATION_NAME: "Dashboard Pendidikan Karangasem"
      MB_LANGUAGE: id  # Bahasa Indonesia

      # --- Query caching (default TTL dalam menit) ---
      MB_CACHE_TTL: 180  # 3 jam default cache

    volumes:
      - metabase_data:/metabase.db  # Persistensi data Metabase (plugin, upload, etc)
      - /dev/urandom:/dev/random:ro  # Entropy untuk kriptografi

    networks:
      - metanet

    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: metabase_postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${METABASE_MB_DB_DBNAME:-metabase}
      POSTGRES_USER: ${METABASE_MB_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${METABASE_MB_DB_PASS:?POSTGRES_PASSWORD harus diisi di .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - metanet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METABASE_MB_DB_USER:-metabase} -d ${METABASE_MB_DB_DBNAME:-metabase}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  metanet:
    driver: bridge

volumes:
  metabase_data:
    driver: local
  postgres_data:
    driver: local
