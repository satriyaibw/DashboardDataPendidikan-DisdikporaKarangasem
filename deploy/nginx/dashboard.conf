# ============================================================================
# Fase 5 — Reverse proxy untuk aplikasi Laravel (Dashboard Data Pendidikan)
#
# Tujuan (MasterPlan §9 / Issue #9): HTTPS penuh untuk aplikasi Laravel.
#
# Cara pakai:
#   1. cp deploy/nginx/dashboard.conf /etc/nginx/sites-available/dashboard
#   2. Ganti dash.example.id dengan domain nyata (D4)
#   3. Sesuaikan path socket PHP-FPM
#   4. ln -s /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx
#
# CATATAN: ini file CONTOH. Tidak ada perubahan runtime yang dilakukan
# terhadap server yang sedang berjalan.
#
# CATATAN PENTING soal HSTS:
#   TIDAK ada `add_header Strict-Transport-Security` di file ini. Header HSTS
#   dikirim oleh aplikasi (App\Http\Middleware\StrictTransportSecurity) agar
#   hanya ada SATU sumber kebenaran, dan agar perilakunya dapat diuji
#   (tests/Feature/SecurityHeadersTest.php). Menambahkan HSTS di dua tempat
#   membuat sulit mengaudit kapan header benar-benar aktif.
# ============================================================================

# Redirect HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name dash.example.id;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dash.example.id;

    root /var/www/dashboard-karangasem/public;
    index index.php;

    charset utf-8;

    # --- Sertifikat TLS (isi lokasi nyata saat deploy) ---
    ssl_certificate     /etc/ssl/certs/dash.example.id.crt;
    ssl_certificate_key /etc/ssl/private/dash.example.id.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Aplikasi tidak menerima unggahan berkas lewat Filament; batas kecil
    # cukup dan membatasi luaran permintaan besar yang tak diinginkan.
    client_max_body_size 2m;

    # Header X-Forwarded-*: WAJIB agar aplikasi tahu request masuk via TLS.
    # Tanpa ini, laravel melihat http dan halaman VIP dapat gagal memuat token
    # dengan skema yang salah. Setel TRUSTED_PROXIES sesuai alamat proxy ini
    # (lihat dashboard-karangasem/.env.example).
    set_real_ip_from 127.0.0.1;
    real_ip_header   X-Forwarded-For;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Deny akses ke file tersembunyi (.env, .git, dsb.) sebagai lapis kedua
    # selain deny bawaan Laravel pada direktori public.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include       fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Agar aplikasi menerima skema https yang benar.
        fastcgi_param HTTPS on;
    }

    # Aset Vite.
    location ~ ^/build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================================
# Verifikasi:
#
#   curl -I http://dash.example.id/           -> 301 ke https
#   curl -I https://dash.example.id/          -> 200 + iframe dashboard publik
#   curl -sI https://dash.example.id/ | grep -i 'strict-transport-security'
#       -> HANYA muncul setelah HSTS_ENABLED=true (jangan sebelumnya!)
#   curl -sI https://dash.example.id/ | grep -i 'x-content-type-options'
#       -> nosniff
#   curl -I https://dash.example.id/.env      -> harus ditolak
#
# Urutan aman mengaktifkan penguatan: TLS -> FORCE_HTTPS=true ->
# SESSION_SECURE_COOKIE=true -> baru HSTS_ENABLED=true.
# ============================================================================
