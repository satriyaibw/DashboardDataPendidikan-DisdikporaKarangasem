# ============================================================================
# Fase 5 — Reverse proxy untuk Metabase: ekspos HANYA endpoint embed
#
# Tujuan (MasterPlan §9 / Issue #9): UI dan admin Metabase tidak boleh
# terekspos ke internet. Hanya endpoint yang dipakai aplikasi Laravel
# (/public/, /embed/, /api/health) yang dilayani; sisanya dibatasi ke
# jaringan VPN/admin.
#
# Cara pakai:
#   1. cp deploy/nginx/metabase.conf /etc/nginx/sites-available/metabase
#   2. Ganti dash.example.id / metabase.example.id dengan domain nyata (D4)
#   3. Sesuaikan allow <IP VPN/admin> dengan alamat yang diizinkan
#   4. ln -s /etc/nginx/sites-available/metabase /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx
#
# CATATAN: ini file CONTOH. Mengaktifkannya tanpa domain + TLS sehingga
# belum dikonfirmasi owner berisiko memutus embed publik. Verifikasi per
# path dengan curl sebelum/ setelah mengaktifkan (lihat bagian bawah).
# ============================================================================

# Redirect HTTP -> HTTPS. HSTS sengaja TIDAK ditaruh di sini: header HSTS
# dikirim oleh aplikasi Laravel (StrictTransportSecurity) supaya hanya ada
# satu sumber kebenaran dan dapat diuji.
server {
    listen 80;
    listen [::]:80;
    server_name metabase.example.id;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name metabase.example.id;

    # --- Sertifikat TLS (isi lokasi nyata saat deploy) ---
    ssl_certificate     /etc/ssl/certs/metabase.example.id.crt;
    ssl_certificate_key /etc/ssl/private/metabase.example.id.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Header X-Forwarded-* WAJIB supaya MB_SITE_URL dan deteksi skema HTTPS
    # Metabase benar (Metabase membaca X-Forwarded-Proto / X-Forwarded-Host).
    # Tanpa ini Metabase dapat menghasilkan URL http:// yang membuat embed
    # ditolak browser.
    set_real_ip_from 127.0.0.1;
    real_ip_header   X-Forwarded-For;

    # --- Endpoint embed: SATU-SATUNYA yang boleh publik ---
    # Public embedding (dashboard publik, tanpa token).
    location ^~ /public/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        # Streaming: kartu yang dirender bertahap akan menggantung bila
        # buffering dinyalakan.
        proxy_buffering off;
    }

    # Signed embedding (dashboard VIP, JWT HS256).
    location ^~ /embed/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_buffering off;
    }

    # Health check untuk monitoring.
    location = /api/health {
        proxy_pass       http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_buffering off;
    }

    # --- Semua path lain: hanya VPN/admin ---
    location / {
        allow 127.0.0.1;          # ganti dengan IP VPN/office/admin
        allow ::1;
        deny  all;                # netralkan baris ini HANYA di lingkungan dev

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
    }
}

# ============================================================================
# Verifikasi (jalankan dari jaringan publik):
#
#   curl -I https://metabase.example.id/admin/
#       -> harus 403 (terblokir allow/deny) BUKAN halaman login
#
#   curl -I https://metabase.example.id/
#       -> harus 403
#
#   curl -I "https://metabase.example.id/embed/dashboard/<token-uji>"
#       -> harus dilayani Metabase (200/400), bukan 403
#
#   curl -I https://metabase.example.id/public/dashboard/<uuid>
#       -> harus dilayani Metabase
#
#   curl -I https://metabase.example.id/api/health
#       -> 200 {"status":"ok"}
#
# Jika /admin justru terbuka dari publik, INI KEGAGALAN: laporkan dan
# batasi kembali sebelum melanjutkan.
#
# Setelah konfigurasi, lengkapi juga di sisi Metabase (Admin -> Embedding):
#   - Allowed domains for iframes = domain aplikasi Laravel
#   - CORS = domain embed bila berbeda dari domain Metabase
# ============================================================================
